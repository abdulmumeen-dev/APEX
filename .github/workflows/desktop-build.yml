name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} desktop package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: windows-latest
            platform: win
          - runner: macos-latest
            platform: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out APEX
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm desktop:${{ matrix.platform }}

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-${{ matrix.platform }}-${{ github.sha }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
